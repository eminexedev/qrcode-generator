<!doctype html>
<html lang="tr">
<head>
    <!-- Temel sayfa iskeleti: ortak stil ve script tanımları burada tutulur. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gelişmiş QR Kod Oluşturucu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-1: #07111f;
            --bg-2: #0f172a;
            --panel: rgba(15, 23, 42, 0.82);
            --line: rgba(148, 163, 184, 0.2);
            --text: #e5eefb;
            --muted: #9fb0cc;
            --accent: #22c55e;
            --accent-2: #38bdf8;
            --danger: #fb7185;
            --control-height: 3rem;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.22), transparent 30%),
                radial-gradient(circle at top right, rgba(34, 197, 94, 0.18), transparent 24%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
        }

        .hero {
            border: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.88), rgba(2, 6, 23, 0.86));
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
        }

        .glass-card {
            border: 1px solid var(--line);
            background: var(--panel);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
        }

        .muted {
            color: var(--muted);
        }

        .app-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .45rem;
            min-height: 2.8rem;
            padding: .72rem 1.05rem;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 1rem;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(34, 197, 94, 0.12));
            color: #dff6ff;
            font-weight: 700;
            letter-spacing: .01em;
            text-decoration: none;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease, border-color .18s ease, color .18s ease;
        }

        .app-button:hover {
            transform: translateY(-1px);
            border-color: rgba(56, 189, 248, 0.48);
            box-shadow: 0 12px 28px rgba(56, 189, 248, 0.16);
            color: #f2fbff;
            text-decoration: none;
        }

        .app-button:focus-visible {
            outline: 2px solid rgba(56, 189, 248, 0.55);
            outline-offset: 2px;
        }

        .app-button--tab {
            min-height: 3rem;
            padding: .75rem 2.25rem;
            border-radius: 1rem 1rem 0 0;
            background: transparent;
            color: var(--muted);
            border-color: transparent;
            box-shadow: none;
        }

        .app-button--tab:hover {
            transform: none;
            box-shadow: none;
            color: #eaf6ff;
            border-color: rgba(148, 163, 184, 0.2);
            background: rgba(56, 189, 248, 0.08);
        }

        .app-button--tab.active {
            color: white;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(34, 197, 94, 0.16));
            border-color: rgba(148, 163, 184, 0.26);
            box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.08);
        }

        .app-button--primary {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.26), rgba(56, 189, 248, 0.22));
            border-color: rgba(34, 197, 94, 0.28);
            color: #effff5;
        }

        .app-button--primary:hover {
            box-shadow: 0 12px 28px rgba(34, 197, 94, 0.18);
            border-color: rgba(34, 197, 94, 0.42);
        }

        .app-button--secondary {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(99, 102, 241, 0.18));
            border-color: rgba(56, 189, 248, 0.28);
            color: #eff9ff;
        }

        .app-button--secondary:hover {
            box-shadow: 0 12px 28px rgba(56, 189, 248, 0.18);
            border-color: rgba(56, 189, 248, 0.44);
        }

        .app-button--outline {
            background: rgba(15, 23, 42, 0.5);
            color: var(--text);
        }

        .app-button--outline:hover {
            background: rgba(56, 189, 248, 0.12);
        }

        .app-button--file {
            padding: .7rem 1rem;
            border-radius: .85rem;
        }

        .app-divider {
            border-top: 1px solid var(--line);
            padding-top: 1rem;
            margin-top: .25rem;
        }

        .form-control,
        .form-select {
            background-color: rgba(15, 23, 42, 0.76);
            border-color: rgba(148, 163, 184, 0.25);
            color: var(--text);
            min-height: var(--control-height);
        }

        .file-picker {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .75rem;
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 1rem;
            background: rgba(15, 23, 42, 0.76);
            min-height: calc(var(--control-height) + .5rem);
        }

        .file-picker__input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .file-picker__button:hover {
            box-shadow: 0 10px 24px rgba(56, 189, 248, 0.18);
        }

        .file-picker__button:focus-visible {
            outline: 2px solid rgba(56, 189, 248, 0.55);
            outline-offset: 2px;
        }

        .file-picker__name {
            min-width: 0;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: rgba(15, 23, 42, 0.92);
            color: var(--text);
            border-color: var(--accent-2);
            box-shadow: 0 0 0 .2rem rgba(56, 189, 248, .16);
        }

        .form-control[type="file"] {
            cursor: pointer;
        }

        .form-control-color {
            min-height: var(--control-height);
            width: 100%;
            padding: .35rem;
        }

        .color-control {
            display: grid;
            grid-template-columns: 4.2rem 1fr auto;
            gap: .55rem;
            align-items: stretch;
        }

        .color-control .form-control-color {
            width: 4.2rem;
            min-width: 4.2rem;
            padding: .2rem;
            border-radius: .85rem;
            height: var(--control-height);
        }

        .color-hex-input {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            letter-spacing: .02em;
            height: var(--control-height);
        }

        .app-button--icon {
            min-height: var(--control-height);
            min-width: var(--control-height);
            width: var(--control-height);
            padding: 0;
            border-radius: .85rem;
            font-size: 1.05rem;
            line-height: 1;
        }

        .form-check-input {
            width: 1.15rem;
            height: 1.15rem;
            margin-top: .15rem;
            background-color: rgba(15, 23, 42, 0.9);
            border-color: rgba(148, 163, 184, 0.35);
            box-shadow: none;
        }

        .form-check-input:checked {
            background-color: var(--accent-2);
            border-color: var(--accent-2);
        }

        .form-check-input:focus {
            border-color: var(--accent-2);
            box-shadow: 0 0 0 .2rem rgba(56, 189, 248, .16);
        }

        .form-control[type="file"] {
            padding: .55rem .75rem;
        }

        .nav-tabs {
            border-bottom: 1px solid var(--line);
        }

        .nav-tabs .nav-item {
            margin-bottom: 0;
        }

        .glass-card label {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            margin-bottom: .45rem;
            padding: .22rem .6rem;
            border-radius: 999px;
            border: 1px solid rgba(56, 189, 248, 0.18);
            background: rgba(56, 189, 248, 0.08);
            color: #dbeafe;
            font-size: .76rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .glass-card .form-check {
            display: flex;
            align-items: center;
            gap: .5rem;
            min-height: var(--control-height);
            padding-top: 0;
        }

        .glass-card .form-check-label {
            margin-bottom: 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--text);
            font-size: .95rem;
            font-weight: 600;
            letter-spacing: 0;
            text-transform: none;
        }

        .glass-card .field-group > label,
        .glass-card .field-group > .form-label {
            margin-bottom: .7rem;
        }

        .badge-safe {
            background: rgba(34, 197, 94, 0.18);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge-suspicious {
            background: rgba(251, 113, 133, 0.16);
            color: #fda4af;
            border: 1px solid rgba(251, 113, 133, 0.28);
        }

        .preview-box {
            min-height: 320px;
            display: grid;
            place-items: center;
            border: 1px dashed rgba(148, 163, 184, 0.28);
            border-radius: 1rem;
            background: rgba(2, 6, 23, 0.28);
        }

        .field-group {
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 1rem;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.45);
        }

        .small-note {
            font-size: .9rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main class="container py-5">
        <div class="hero rounded-4 p-4 p-lg-5 mb-4">
            <div class="row align-items-center g-4">
                <div class="col-lg-8">
                    <span class="badge rounded-pill badge-safe mb-3">Güvenlik + Özelleştirilebilir</span>
                    <h1 class="display-6 fw-semibold mb-3">Gelişmiş QR Kod Oluşturucu, Çözümleyici ve Güvenlik Tarayıcı</h1>
                    <p class="lead muted mb-0">URL, Wi-Fi, VCard ve kripto/IBAN destekli üretim; logo ekleme, gradient, şeffaf arka plan, SVG/PNG/GIF çıktı ve temel link güvenlik analizi sağlar.</p>
                </div>
            </div>
        </div>

        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleFields() {
            // Seçilen veri tipine göre ilgili form alanlarını görünür yapar.
            const type = document.getElementById('id_data_type')?.value;
            const wifi = document.querySelectorAll('[data-field-group="wifi"]');
            const vcard = document.querySelectorAll('[data-field-group="vcard"]');
            const crypto = document.querySelectorAll('[data-field-group="crypto"]');
            const url = document.querySelectorAll('[data-field-group="url"]');

            [wifi, vcard, crypto, url].forEach(nodes => nodes.forEach(node => node.classList.add('d-none')));

            if (type === 'wifi') { wifi.forEach(node => node.classList.remove('d-none')); }
            if (type === 'vcard') { vcard.forEach(node => node.classList.remove('d-none')); }
            if (type === 'crypto') { crypto.forEach(node => node.classList.remove('d-none')); }
            if (type === 'url') { url.forEach(node => node.classList.remove('d-none')); }
        }

        function toggleGradientFields() {
            // Gradient kapalıysa ikinci renk alanını gizler.
            const enabled = document.getElementById('id_use_gradient')?.checked;
            const secondary = document.getElementById('secondary-color-wrap');
            if (secondary) {
                secondary.classList.toggle('d-none', !enabled);
            }
        }

        function normalizeHexColor(value) {
            // Hex renk değeri geçerliyse standart formata (#rrggbb) dönüştürür.
            const trimmed = (value || '').trim();
            const prefixed = trimmed.startsWith('#') ? trimmed : `#${trimmed}`;
            return /^#[0-9a-fA-F]{6}$/.test(prefixed) ? prefixed.toLowerCase() : null;
        }

        function randomHexColor() {
            const hex = Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
            return `#${hex}`;
        }

        function initColorControls() {
            // Renk seçici inputları ile hex text inputlarını çift yönlü senkronlar.
            document.querySelectorAll('.color-hex-input').forEach((hexInput) => {
                const targetId = hexInput.dataset.colorTarget;
                if (!targetId) {
                    return;
                }

                const colorInput = document.getElementById(targetId);
                if (!colorInput) {
                    return;
                }

                const syncHexFromColor = () => {
                    hexInput.value = colorInput.value;
                    hexInput.classList.remove('is-invalid');
                };

                const applyHexToColor = () => {
                    const normalized = normalizeHexColor(hexInput.value);
                    if (!normalized) {
                        hexInput.classList.add('is-invalid');
                        return;
                    }

                    colorInput.value = normalized;
                    hexInput.value = normalized;
                    hexInput.classList.remove('is-invalid');
                };

                colorInput.addEventListener('input', syncHexFromColor);
                hexInput.addEventListener('change', applyHexToColor);
                hexInput.addEventListener('blur', applyHexToColor);
                syncHexFromColor();
            });

            document.querySelectorAll('.color-random-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const targetId = button.dataset.colorTarget;
                    if (!targetId) {
                        return;
                    }

                    const colorInput = document.getElementById(targetId);
                    if (!colorInput) {
                        return;
                    }

                    const hexInput = document.querySelector(`.color-hex-input[data-color-target="${targetId}"]`);
                    const randomColor = randomHexColor();
                    colorInput.value = randomColor;
                    if (hexInput) {
                        hexInput.value = randomColor;
                        hexInput.classList.remove('is-invalid');
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Sayfa açıldığında tüm etkileşimli bileşenleri başlatır.
            const dataType = document.getElementById('id_data_type');
            const gradient = document.getElementById('id_use_gradient');
            if (dataType) dataType.addEventListener('change', toggleFields);
            if (gradient) gradient.addEventListener('change', toggleGradientFields);

            document.querySelectorAll('.file-picker__input').forEach((input) => {
                const nameElement = input.closest('.file-picker')?.querySelector('.file-picker__name');
                const updateName = () => {
                    if (!nameElement) {
                        return;
                    }

                    nameElement.textContent = input.files && input.files.length > 0
                        ? input.files[0].name
                        : 'Dosya seçilmedi';
                };

                input.addEventListener('change', updateName);
                updateName();
            });

            initColorControls();
            toggleFields();
            toggleGradientFields();
        });
    </script>
</body>
</html>
